<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단봇 — 단국대 학사 AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    /* ══════════════════════════════════════════
       CSS 변수 — 라이트 / 다크 테마
    ══════════════════════════════════════════ */
    :root {
      --nav:          #004c97;
      --accent:       #2563eb;
      --accent-soft:  #eff6ff;
      --bg:           #f6f7fb;
      --surface:      #ffffff;
      --text:         #111827;
      --muted:        #6b7280;
      --hint:         #9ca3af;
      --border:       rgba(0,0,0,0.07);
      --bubble-user:  #1d4ed8;
      --chip-border:  #dbeafe;
      --panel:        #fafbfe;
      --panel-border: rgba(37,99,235,0.1);
      --tag-bg:       #eff6ff;
      --tag-text:     #1e40af;
      --dot-red:      #f87171;
      --dot-amber:    #fbbf24;
      --dot-blue:     #60a5fa;
      --dot-green:    #34d399;
      --shadow:       0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --faq-shadow:   0 2px 8px rgba(37,99,235,0.07), 0 1px 3px rgba(0,0,0,0.04);
    }
    body.dark {
      --bg:           #0f1117;
      --surface:      #171923;
      --text:         #f1f5f9;
      --muted:        #94a3b8;
      --hint:         #475569;
      --border:       rgba(255,255,255,0.07);
      --bubble-user:  #1d4ed8;
      --chip-border:  #1e3a5f;
      --panel:        #13161f;
      --panel-border: rgba(99,155,235,0.12);
      --tag-bg:       #1e2a3a;
      --tag-text:     #93c5fd;
      --accent-soft:  #1e2a3a;
      --shadow:       0 1px 3px rgba(0,0,0,0.3);
      --faq-shadow:   0 2px 8px rgba(0,0,0,0.3);
    }

    /* ══════════════════════════════════════════
       기본 레이아웃
    ══════════════════════════════════════════ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, color 0.2s;
    }

    /* ══════════════════════════════════════════
       헤더
    ══════════════════════════════════════════ */
    #header {
      background: var(--nav);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 100;
    }
    .hd-brand { display: flex; align-items: center; gap: 10px; }

    /* ✅ 로고 이미지 */
    .hd-logo {
      width: 36px; height: 36px;
      border-radius: 8px;
      overflow: hidden;
      background: white;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .hd-logo img { width: 100%; height: 100%; object-fit: cover; }

    .hd-pill {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 20px;
      padding: 2px 9px;
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      font-weight: 500;
    }
    .hd-actions { display: flex; gap: 5px; }
    .hd-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 8px;
      width: 33px; height: 33px;
      cursor: pointer;
      color: rgba(255,255,255,0.95);
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .hd-btn:hover { background: rgba(255,255,255,0.28); }

    /* ══════════════════════════════════════════
       본문
    ══════════════════════════════════════════ */
    #body { display: flex; flex: 1; overflow: hidden; }
    #chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

    /* ══════════════════════════════════════════
       ① 웰컴 화면
    ══════════════════════════════════════════ */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 24px;
    }

    /* ✅ 웰컴 로고 */
    .welcome-logo {
      width: 80px; height: 80px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,76,151,0.2);
    }
    .welcome-logo img { width: 100%; height: 100%; object-fit: cover; }

    .welcome-text { text-align: center; }
    .welcome-hi {
      font-size: 24px; font-weight: 700;
      color: var(--text); letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    .welcome-sub { font-size: 14px; color: var(--muted); line-height: 1.7; }

    .faq-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      width: 100%;
      max-width: 480px;
    }
    .faq-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 14px 12px;
      cursor: pointer; text-align: left;
      transition: all 0.18s;
      box-shadow: var(--faq-shadow);
      display: flex; flex-direction: column; gap: 6px;
    }
    .faq-card:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(37,99,235,0.13);
    }
    .faq-card:active { transform: translateY(0); }
    .faq-icon  { font-size: 20px; line-height: 1; }
    .faq-label { font-size: 12.5px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .faq-sub   { font-size: 11px; color: var(--muted); line-height: 1.35; }

    /* ══════════════════════════════════════════
       ② 채팅 화면
    ══════════════════════════════════════════ */
    #chatview { flex: 1; display: none; flex-direction: column; overflow: hidden; }

    #messages {
      flex: 1; overflow-y: auto;
      padding: 20px 20px 12px;
      display: flex; flex-direction: column; gap: 20px;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-row { display: flex; gap: 10px; align-items: flex-end; }
    .msg-row.me { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      flex-shrink: 0; color: white;
      background: var(--nav);
      overflow: hidden;
    }
    .avatar.me { background: #7c3aed; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .msg-col { display: flex; flex-direction: column; gap: 5px; max-width: 78%; }
    .msg-col.me { align-items: flex-end; max-width: 68%; }
    .msg-name { font-size: 11px; color: var(--hint); font-weight: 500; padding: 0 4px; }

    .bub-wrap { position: relative; display: inline-block; max-width: 100%; }
    .bubble {
      padding: 11px 16px;
      border-radius: 18px;
      font-size: 14px; line-height: 1.7;
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow);
      word-break: break-word;
    }
    .bubble.bot { border-bottom-left-radius: 5px; }
    .bubble.me  { background: var(--bubble-user); color: #fff; border-bottom-right-radius: 5px; }

    /* ✅ 에러 말풍선 */
    .bubble.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    body.dark .bubble.error {
      background: #2d1515;
      color: #fca5a5;
      border-color: #7f1d1d;
    }

    .cpy-btn {
      position: absolute; top: 8px; right: 10px;
      background: rgba(0,0,0,0.08);
      border: none; border-radius: 6px;
      width: 25px; height: 25px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0;
      transition: opacity 0.15s;
      color: var(--muted); font-size: 12px;
    }
    body.dark .cpy-btn { background: rgba(255,255,255,0.1); }
    .bub-wrap:hover .cpy-btn { opacity: 1; }
    .cpy-btn:hover { background: rgba(0,0,0,0.16); color: var(--text); }

    .src-card {
      display: flex; align-items: center; gap: 8px;
      background: var(--accent-soft);
      border: 1px solid var(--chip-border);
      border-radius: 10px;
      padding: 7px 12px;
      text-decoration: none;
      transition: border-color 0.15s;
      max-width: 100%;
    }
    .src-card:hover { border-color: var(--accent); }
    .src-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .src-body { flex: 1; min-width: 0; }
    .src-title { font-size: 11px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .src-sub   { font-size: 10px; color: var(--muted); margin-top: 1px; }

    .img-wrap { margin-top: 6px; }
    .chat-img { width: 100%; max-width: 340px; border-radius: 10px; border: 1px solid var(--border); cursor: zoom-in; }

    #typing-row { display: none; }
    .typing-bub {
      background: var(--surface);
      border-radius: 18px; border-bottom-left-radius: 5px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .dots { display: flex; align-items: center; gap: 4px; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--hint);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-5px); }
    }

    /* ══════════════════════════════════════════
       입력창 — 통합 박스
    ══════════════════════════════════════════ */
    #input-area {
      padding: 12px 20px 18px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .inp-unified {
      display: flex; align-items: center;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 28px;
      padding: 6px 6px 6px 18px;
      transition: border-color 0.15s;
    }
    .inp-unified:focus-within { border-color: var(--accent); }
    #user-input {
      flex: 1; background: none; border: none; outline: none;
      font-size: 14px; font-family: 'Noto Sans KR', sans-serif;
      color: var(--text); padding: 4px 0; min-width: 0;
    }
    #user-input::placeholder { color: var(--hint); }

    /* ✅ 전송 버튼 비활성화 상태 */
    #send-btn {
      background: var(--accent); color: #fff;
      border: none; border-radius: 50%;
      width: 36px; height: 36px; flex-shrink: 0;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: transform 0.15s, background 0.15s, opacity 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: #1d4ed8; transform: scale(1.06); }
    #send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    #user-input:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ══════════════════════════════════════════
       사이드 패널
    ══════════════════════════════════════════ */
    #side-panel {
      width: 200px;
      background: var(--panel);
      border-left: 1px solid var(--panel-border);
      padding: 16px 14px;
      display: flex; flex-direction: column; gap: 20px;
      overflow-y: auto; flex-shrink: 0;
    }
    #side-panel::-webkit-scrollbar { width: 3px; }
    #side-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .sec-label {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.7px;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 5px;
    }
    .cal-row { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; }
    .cal-row + .cal-row { border-top: 1px solid var(--border); }
    .cal-ind { display: flex; flex-direction: column; align-items: center; gap: 1px; flex-shrink: 0; padding-top: 3px; }
    .cal-d   { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .cal-line{ width: 1px; flex: 1; min-height: 6px; background: var(--border); }
    .cal-date{ font-size: 10px; color: var(--hint); font-weight: 500; }
    .cal-text{ font-size: 11.5px; color: var(--text); line-height: 1.4; margin-top: 1px; }

    .links { display: flex; flex-direction: column; gap: 5px; }
    .lnk {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 9px;
      background: var(--surface);
      border: 1px solid var(--border); border-radius: 9px;
      font-size: 11.5px; color: var(--text);
      text-decoration: none;
      transition: all 0.15s;
      box-shadow: var(--shadow);
    }
    .lnk:hover { border-color: var(--accent); color: var(--accent); }
    .lnk i { font-size: 14px; color: var(--muted); }
    .lnk:hover i { color: var(--accent); }

    .ntc { padding: 7px 0; }
    .ntc + .ntc { border-top: 1px solid var(--border); }
    .ntc-tag {
      display: inline-block; font-size: 10px; font-weight: 700;
      background: var(--tag-bg); color: var(--tag-text);
      padding: 2px 7px; border-radius: 5px; margin-bottom: 4px;
    }
    .ntc-text { font-size: 11.5px; color: var(--text); line-height: 1.4; }
    .ntc-date { font-size: 10px; color: var(--hint); margin-top: 3px; }

    /* ══════════════════════════════════════════
       이미지 모달
    ══════════════════════════════════════════ */
    #img-modal {
      display: none; position: fixed; z-index: 2000;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.82);
      cursor: zoom-out;
      align-items: center; justify-content: center;
    }
    #img-modal.open { display: flex; }
    #modal-img { max-width: 90%; max-height: 90%; border-radius: 6px; }

    /* ══════════════════════════════════════════
       ✅ 모바일 반응형 (768px 이하)
    ══════════════════════════════════════════ */
    @media (max-width: 768px) {
      /* 사이드 패널 숨김 */
      #side-panel { display: none; }

      /* 웰컴 화면 조정 */
      #welcome { padding: 24px 16px; gap: 20px; }
      .welcome-hi { font-size: 20px; }
      .welcome-logo { width: 64px; height: 64px; border-radius: 16px; }

      /* FAQ 2열로 변경 */
      .faq-grid {
        grid-template-columns: repeat(2, 1fr);
        max-width: 100%;
      }

      /* 말풍선 최대 너비 확대 */
      .msg-col { max-width: 88%; }
      .msg-col.me { max-width: 82%; }

      /* 입력창 패딩 조정 */
      #input-area { padding: 10px 14px 14px; }

      /* 메시지 패딩 조정 */
      #messages { padding: 16px 14px 10px; }

      /* hd-pill 숨김 (좁은 화면에서 잘림 방지) */
      .hd-pill { display: none; }
    }

    @media (max-width: 480px) {
      /* 더 작은 화면에서 FAQ 1열 */
      .faq-grid { grid-template-columns: repeat(2, 1fr); }
      .bubble { font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- ── 헤더 ── -->
  <div id="header">
    <div class="hd-brand">
      <!-- ✅ 로고 이미지로 교체 -->
      <div class="hd-logo">
        <img src="/static/logo.png" alt="단봇 로고"
             onerror="this.parentElement.style.padding='6px';this.parentElement.innerHTML='<svg width=&quot;22&quot; height=&quot;22&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;%23004c97&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;3&quot;/><path d=&quot;M12 2v3M12 19v3M2 12h3M19 12h3&quot;/></svg>'">
      </div>
      <span class="hd-pill">단국대 학사 AI</span>
    </div>
    <div class="hd-actions">
      <button class="hd-btn" id="reset-btn"   aria-label="대화 초기화"   title="대화 초기화"><i class="ti ti-refresh"></i></button>
      <button class="hd-btn" id="dark-btn"    aria-label="다크모드 전환" title="다크모드 전환"><i class="ti ti-moon"></i></button>
      <button class="hd-btn" id="setting-btn" aria-label="설정"          title="설정"><i class="ti ti-settings"></i></button>
    </div>
  </div>

  <!-- ── 본문 ── -->
  <div id="body">
    <div id="chat">

      <!-- ① 웰컴 화면 -->
      <div id="welcome">
        <!-- ✅ 웰컴 로고 추가 -->
        <div class="welcome-logo">
          <img src="/static/logo.png" alt="단봇"
               onerror="this.style.display='none'">
        </div>

        <div class="welcome-text">
          <div class="welcome-hi">무엇을 도와드릴까요?</div>
          <div class="welcome-sub">학사일정, 장학금, 셔틀버스 등<br>단국대 정보를 실시간으로 알려드려요</div>
        </div>

        <div class="faq-grid">
          <button class="faq-card" data-q="이번 학기 학사일정 알려줘">
            <span class="faq-icon">📅</span>
            <span class="faq-label">학사일정</span>
            <span class="faq-sub">주요 일정 한눈에</span>
          </button>
          <button class="faq-card" data-q="장학금 신청 방법이랑 종류 알려줘">
            <span class="faq-icon">🎓</span>
            <span class="faq-label">장학금</span>
            <span class="faq-sub">신청 방법·종류</span>
          </button>
          <button class="faq-card" data-q="셔틀버스 노선이랑 시간표 알려줘">
            <span class="faq-icon">🚌</span>
            <span class="faq-label">셔틀버스</span>
            <span class="faq-sub">노선·시간표</span>
          </button>
          <button class="faq-card" data-q="수강신청 일정이랑 방법 알려줘">
            <span class="faq-icon">📝</span>
            <span class="faq-label">수강신청</span>
            <span class="faq-sub">일정·신청 방법</span>
          </button>
          <button class="faq-card" data-q="성적 처리 및 졸업 요건 알려줘">
            <span class="faq-icon">📊</span>
            <span class="faq-label">성적·졸업</span>
            <span class="faq-sub">이수 요건·GPA</span>
          </button>
          <button class="faq-card" data-q="교내 편의시설 위치 알려줘">
            <span class="faq-icon">🏫</span>
            <span class="faq-label">편의시설</span>
            <span class="faq-sub">식당·도서관</span>
          </button>
        </div>
      </div>

      <!-- ② 채팅 화면 -->
      <div id="chatview">
        <div id="messages">

          <!-- 타이핑 인디케이터 -->
          <div class="msg-row" id="typing-row">
            <div class="avatar" id="typing-avatar">단</div>
            <div class="msg-col">
              <span class="msg-name">단봇</span>
              <div class="typing-bub">
                <div class="dots">
                  <div class="dot"></div>
                  <div class="dot"></div>
                  <div class="dot"></div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- 입력창 -->
      <div id="input-area">
        <div class="inp-unified">
          <input type="text" id="user-input"
            placeholder="학사, 장학금, 셔틀버스 등 뭐든 물어보세요"
            autocomplete="off">
          <button id="send-btn" aria-label="전송">
            <i class="ti ti-send"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 사이드 패널 -->
    <div id="side-panel">

      <div>
        <div class="sec-label"><i class="ti ti-calendar-event" style="font-size:12px"></i> 학사일정</div>
        <div>
          <div class="cal-row">

            <div class="cal-ind"><div class="cal-d" style="background:var(--dot-blue)"></div><div class="cal-line"></div></div>

      <div>
        <div class="sec-label"><i class="ti ti-bell" style="font-size:12px"></i> 최신 공지</div>
        <div id="notice-list">
          <div class="ntc">

            <div class="ntc-text">여름계절학기 수강신청 일정</div>
            <div class="ntc-date">2025.06.15</div>
          </div>
          <div class="ntc">
            <span class="ntc-tag">시설</span>
            <div class="ntc-text">도서관 방학 중 운영시간 변경</div>
            <div class="ntc-date">2025.06.12</div>

  <!-- 이미지 모달 -->
  <div id="img-modal">
    <img id="modal-img" alt="확대 이미지">
  </div>

  <script>
    /* ══════════════════════════════════════════
       DOM 참조
    ══════════════════════════════════════════ */
    const welcome    = document.getElementById('welcome');
    const chatview   = document.getElementById('chatview');
    const messages   = document.getElementById('messages');
    const typingRow  = document.getElementById('typing-row');
    const userInput  = document.getElementById('user-input');
    const sendBtn    = document.getElementById('send-btn');
    const imgModal   = document.getElementById('img-modal');
    const modalImg   = document.getElementById('modal-img');

    /* ══════════════════════════════════════════
       ✅ 타이핑 아바타 로고 설정
    ══════════════════════════════════════════ */
    const typingAvatar = document.getElementById('typing-avatar');
    const logoImg = document.createElement('img');
    logoImg.src = '/static/logo.png';
    logoImg.alt = '단봇';
    logoImg.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
    logoImg.onerror = () => { typingAvatar.textContent = '단'; };
    typingAvatar.style.background = 'white';
    typingAvatar.appendChild(logoImg);

    /* ══════════════════════════════════════════
       화면 전환
    ══════════════════════════════════════════ */
    function showChat() {
      welcome.style.display = 'none';
      chatview.style.display = 'flex';
    }
    function showWelcome() {
      chatview.style.display = 'none';
      welcome.style.display = 'flex';
    }

    /* ══════════════════════════════════════════
       ✅ 입력창 활성화 / 비활성화
    ══════════════════════════════════════════ */
    function setInputDisabled(disabled) {
      userInput.disabled = disabled;
      sendBtn.disabled = disabled;
      if (disabled) {
        userInput.placeholder = '답변을 기다리는 중...';
      } else {
        userInput.placeholder = '학사, 장학금, 셔틀버스 등 뭐든 물어보세요';
        userInput.focus();
      }
    }

    /* ══════════════════════════════════════════
       다크모드 토글
    ══════════════════════════════════════════ */
    document.getElementById('dark-btn').addEventListener('click', function () {
      document.body.classList.toggle('dark');
      this.querySelector('i').className =
        document.body.classList.contains('dark') ? 'ti ti-sun' : 'ti ti-moon';
    });

    /* ══════════════════════════════════════════
       대화 초기화
    ══════════════════════════════════════════ */
    document.getElementById('reset-btn').addEventListener('click', () => {
      [...messages.querySelectorAll('.msg-row:not(#typing-row)')]
        .forEach(el => el.remove());
      typingRow.style.display = 'none';
      setInputDisabled(false);
      showWelcome();
    });

    /* ══════════════════════════════════════════
       이미지 모달
    ══════════════════════════════════════════ */
    function openModal(src) {
      modalImg.src = src;
      imgModal.classList.add('open');
    }
    imgModal.addEventListener('click', () => imgModal.classList.remove('open'));

    /* ══════════════════════════════════════════
       복사 버튼
    ══════════════════════════════════════════ */
    function setupCopyBtn(btn) {
      btn.addEventListener('click', () => {
        const bub = btn.previousElementSibling;
        navigator.clipboard.writeText(bub ? bub.innerText : '').catch(() => {});
        btn.innerHTML = '<i class="ti ti-check"></i>';
        setTimeout(() => { btn.innerHTML = '<i class="ti ti-copy"></i>'; }, 1400);
      });
    }

    /* ══════════════════════════════════════════
       메시지 DOM 생성
    ══════════════════════════════════════════ */
    function createBubWrap(html, isMe) {
      const wrap = document.createElement('div');
      wrap.className = 'bub-wrap';
      const bub = document.createElement('div');
      bub.className = 'bubble ' + (isMe ? 'me' : 'bot');
      if (!isMe) bub.style.paddingRight = '38px';
      bub.innerHTML = html;
      wrap.appendChild(bub);
      if (!isMe) {
        const cpy = document.createElement('button');
        cpy.className = 'cpy-btn';
        cpy.setAttribute('aria-label', '복사');
        cpy.innerHTML = '<i class="ti ti-copy"></i>';
        setupCopyBtn(cpy);
        wrap.appendChild(cpy);
      }
      return wrap;
    }

    function appendUserMessage(text) {
      const row = document.createElement('div');
      row.className = 'msg-row me';
      const av = document.createElement('div');
      av.className = 'avatar me';
      av.textContent = '나';
      const col = document.createElement('div');
      col.className = 'msg-col me';
      col.appendChild(createBubWrap(text, true));
      row.appendChild(av);
      row.appendChild(col);
      messages.insertBefore(row, typingRow);
      messages.scrollTop = messages.scrollHeight;
    }

    /* ✅ 로고 아바타 생성 헬퍼 */
    function createBotAvatar() {
      const av = document.createElement('div');
      av.className = 'avatar';
      av.style.background = 'white';
      const img = document.createElement('img');
      img.src = '/static/logo.png';
      img.alt = '단봇';
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
      img.onerror = () => { av.style.background = 'var(--nav)'; av.textContent = '단'; img.remove(); };
      av.appendChild(img);
      return av;
    }

    function createAiRow() {
      const row = document.createElement('div');
      row.className = 'msg-row';
      const av = createBotAvatar();  // ✅ 로고 아바타
      const col = document.createElement('div');
      col.className = 'msg-col';
      const name = document.createElement('span');
      name.className = 'msg-name';
      name.textContent = '단봇';
      const bub = document.createElement('div');
      bub.className = 'bubble bot';
      bub.style.paddingRight = '38px';
      const cpy = document.createElement('button');
      cpy.className = 'cpy-btn';
      cpy.setAttribute('aria-label', '복사');
      cpy.innerHTML = '<i class="ti ti-copy"></i>';
      setupCopyBtn(cpy);
      const wrap = document.createElement('div');
      wrap.className = 'bub-wrap';
      wrap.appendChild(bub);
      wrap.appendChild(cpy);
      col.appendChild(name);
      col.appendChild(wrap);
      row.appendChild(av);
      row.appendChild(col);
      return { row, col, bub };
    }

    /* ══════════════════════════════════════════
       출처 카드 생성
    ══════════════════════════════════════════ */
    function appendSourceCard(col, title, url, date) {
      const a = document.createElement('a');
      a.className = 'src-card';
      a.href = url || '#';
      a.target = '_blank';
      a.innerHTML = `
        <div class="src-dot"></div>
        <div class="src-body">
          <div class="src-title">${title}</div>
          <div class="src-sub">dankook.ac.kr · ${date}</div>
        </div>
        <i class="ti ti-external-link" style="font-size:12px;color:var(--muted)"></i>`;
      col.appendChild(a);
    }

    /* ══════════════════════════════════════════
       셔틀버스 이미지 파싱
    ══════════════════════════════════════════ */
    function parseShuttleImages(fullText, bub, col) {
      if (!fullText.includes('shuttle_URL:')) return false;
      const [textPart, urlPart] = fullText.split('shuttle_URL:');
      bub.innerHTML = textPart.replace(/\n/g, '<br>');
      const urls = urlPart.trim().replace(/[\[\]]/g, '').split(',');
      urls.forEach(rawUrl => {
        const url = rawUrl.trim();
        if (!url) return;
        const wrap = document.createElement('div');
        wrap.className = 'img-wrap';
        const img = document.createElement('img');
        img.src = url;
        img.className = 'chat-img';
        img.alt = '셔틀버스 노선 이미지';
        img.addEventListener('click', () => openModal(url));
        wrap.appendChild(img);
        col.appendChild(wrap);
      });
      return true;
    }

    /* ══════════════════════════════════════════
       메인 전송 함수 — Flask /chat 스트리밍 연동
    ══════════════════════════════════════════ */
    async function sendMessage(text) {
      const message = text || userInput.value.trim();
      if (!message) return;

      showChat();
      appendUserMessage(message);
      userInput.value = '';

      /* ✅ 전송 중 입력창 비활성화 */
      setInputDisabled(true);

      typingRow.style.display = 'flex';
      messages.scrollTop = messages.scrollHeight;

      const { row, col, bub } = createAiRow();

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const reader  = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText  = '';

        typingRow.style.display = 'none';
        messages.insertBefore(row, typingRow);

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          fullText += chunk;
          if (!fullText.includes('shuttle_URL:')) {
            bub.innerHTML = fullText.replace(/\n/g, '<br>');
          }
          messages.scrollTop = messages.scrollHeight;
        }

        /* 최종 후처리 */
        if (!parseShuttleImages(fullText, bub, col)) {
          bub.innerHTML = fullText.replace(/\n/g, '<br>');
        }

        if (fullText.includes('SOURCE_URL:')) {
          const m = fullText.match(/SOURCE_URL:([^\|]+)\|([^\|]+)\|(.+)/);
          if (m) {
            bub.innerHTML = bub.innerHTML.replace(/SOURCE_URL:.*/g, '');
            appendSourceCard(col, m[2].trim(), m[1].trim(), m[3].trim());
          }
        }

        messages.scrollTop = messages.scrollHeight;

      } catch (err) {
        /* ✅ 에러 말풍선 */
        typingRow.style.display = 'none';
        if (!row.parentNode) messages.insertBefore(row, typingRow);
        bub.className = 'bubble error';
        bub.style.paddingRight = '16px';
        bub.innerHTML = '<i class="ti ti-alert-circle" style="margin-right:6px"></i>죄송합니다, 오류가 발생했어요. 잠시 후 다시 시도해주세요.';
        console.error('단봇 오류:', err);
      } finally {
        /* ✅ 응답 완료 후 입력창 재활성화 */
        setInputDisabled(false);
      }
    }

    /* ══════════════════════════════════════════
       이벤트 리스너
    ══════════════════════════════════════════ */
    sendBtn.addEventListener('click', () => sendMessage());
    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    document.querySelectorAll('.faq-card').forEach(btn => {
      btn.addEventListener('click', () => sendMessage(btn.dataset.q));
    });
  </script>
